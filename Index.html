<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web App GAS</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fa;
    }

    .header {
      background: #0f766e;
      color: white;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      padding: 20px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #0f766e;
      color: white;
      cursor: pointer;
    }

    #hasil {
      margin-top: 20px;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="header">
    Aplikasi Web GAS
  </div>

  <div class="container">

    <button onclick="loadData()">
      Ambil Data dari GAS
    </button>

    <div id="hasil">
      Silakan klik tombol.
    </div>

  </div>

<script>

  // GANTI dengan URL Web App GAS Anda
  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbw3lNiAwnYMAHPNyWvJYgl59yS1mnR1w7vqXp0rbsw7x3uJe7BCRLB4f8lxoE3s43f8/exec";


  async function loadData() {

    const hasil = document.getElementById("hasil");

    hasil.innerHTML = "Loading...";

    try {

      const response = await fetch(
        GAS_URL + "?action=getData"
      );

      const data = await response.json();

      console.log(data);

      if (data.success) {

        hasil.innerHTML =
          "<pre>" +
          JSON.stringify(data.data, null, 2) +
          "</pre>";

      } else {

        hasil.innerHTML =
          "Error: " + data.message;

      }

    } catch (error) {

      console.error(error);

      hasil.innerHTML =
        "Gagal terhubung ke GAS:<br>" +
        error;

    }

  }

</script>

</body>
</html>
